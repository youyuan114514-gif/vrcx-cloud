<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>VRCX Cloud — Edge Control &amp; Diagnostics</title>
        <style>
            :root {
                color-scheme: dark;
                --bg: #0f1117;
                --card: #171b24;
                --border: #2a3142;
                --text: #e6ebf5;
                --muted: #9aa4b8;
                --accent: #60a5fa;
                --ok: #34d399;
                --warn: #fbbf24;
                --err: #f87171;
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
                background: var(--bg);
                color: var(--text);
                line-height: 1.5;
            }
            main {
                max-width: 820px;
                margin: 0 auto;
                padding: 32px 20px 64px;
            }
            h1 {
                margin: 0 0 6px;
                font-size: 1.6rem;
            }
            p.sub {
                margin: 0 0 24px;
                color: var(--muted);
            }
            .card {
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 12px;
                padding: 18px 20px;
                margin-bottom: 16px;
            }
            .row {
                display: flex;
                gap: 10px;
                flex-wrap: wrap;
                align-items: center;
            }
            input {
                background: #0b0e14;
                border: 1px solid var(--border);
                color: var(--text);
                border-radius: 8px;
                padding: 8px 12px;
                font-size: 0.92rem;
                flex: 1;
                min-width: 180px;
            }
            button {
                background: var(--accent);
                color: #08101c;
                border: 0;
                border-radius: 8px;
                padding: 8px 14px;
                font-weight: 600;
                cursor: pointer;
                font-size: 0.92rem;
            }
            button:hover {
                filter: brightness(1.08);
            }
            pre {
                margin: 12px 0 0;
                padding: 12px;
                background: #0b0e14;
                border: 1px solid var(--border);
                border-radius: 8px;
                overflow-x: auto;
                font-size: 0.84rem;
                color: #cbd5e1;
            }
            .badge {
                display: inline-block;
                padding: 2px 8px;
                border-radius: 999px;
                font-size: 0.78rem;
                background: rgba(96, 165, 250, 0.16);
                color: var(--accent);
                margin-left: 8px;
                vertical-align: middle;
            }
        </style>
    </head>
    <body>
        <main>
            <h1>VRCX Cloud <span class="badge">Phase 0 Edge Ready</span></h1>
            <p class="sub">
                Stateless Cloudflare Workers + Sharded D1 + AgentHub Durable Object. Full VRCX Web UI lands in Phase 1.
            </p>

            <section class="card">
                <div class="row">
                    <input id="token" type="password" placeholder="Optional POC_ADMIN_TOKEN (leave blank if unset)" />
                    <button id="btn-health">Check /health</button>
                    <button id="btn-status">Check AgentHub DO</button>
                    <button id="btn-probe">Probe VRChat WAF</button>
                </div>
                <pre id="out-system">Click any button above to verify your deployed Cloudflare edge bindings.</pre>
            </section>

            <section class="card">
                <div class="row">
                    <input id="search-q" type="text" placeholder="Test Entity FTS5 search (e.g. Sakura / 木之本)" />
                    <button id="btn-search">Run FTS5 Search + EXPLAIN</button>
                </div>
                <pre id="out-search">Initial D1 schema &amp; FTS5 trigram tables auto-initialize on first request.</pre>
            </section>
        </main>
        <script>
            const tokenInput = document.getElementById('token');
            const outSystem = document.getElementById('out-system');
            const outSearch = document.getElementById('out-search');

            function authHeaders() {
                const t = tokenInput.value.trim();
                return t ? { Authorization: 'Bearer ' + t } : {};
            }

            async function callApi(url, targetEl) {
                targetEl.textContent = 'Requesting ' + url + ' ...';
                try {
                    const res = await fetch(url, { headers: authHeaders() });
                    const data = await res.json();
                    targetEl.textContent = JSON.stringify({ status: res.status, ...data }, null, 2);
                } catch (err) {
                    targetEl.textContent = 'Error: ' + (err && err.message ? err.message : String(err));
                }
            }

            document.getElementById('btn-health').onclick = () => callApi('/health', outSystem);
            document.getElementById('btn-status').onclick = () => callApi('/api/agent/status', outSystem);
            document.getElementById('btn-probe').onclick = () => callApi('/poc/vrc-probe', outSystem);
            document.getElementById('btn-search').onclick = () => {
                const q = document.getElementById('search-q').value.trim();
                callApi('/poc/search?q=' + encodeURIComponent(q) + '&explain=1', outSearch);
            };
        </script>
    </body>
</html>
